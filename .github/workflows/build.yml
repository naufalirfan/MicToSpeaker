name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APKs for release
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/MicToSpeaker-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/MicToSpeaker-release.apk
          fi
          ls -la release-apks/

      - name: Verify APK Signatures
        run: |
          for apk in release-apks/*.apk; do
            echo "=== Verifying signature for $apk ==="
            $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$apk"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MicToSpeaker-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.9
          name: "Mic to Speaker - NFL v1.0.9 (Neon Purple/Magenta Dark UI)"
          body: |
            ## Mic to Speaker - NFL v1.0.8 (Exit, Minimize & 17 Real-time Voice Effects)
            Automated build from commit ${{ github.sha }}.
            
            ### Fitur Baru & Peningkatan di v1.0.8:
            1. **🔴 Tombol Exit Aplikasi Penuh**:
               - Terletak di pojok kanan atas `TopAppBar` (ikon power merah) dan di bagian bawah `SettingsScreen`.
               - Menghentikan Oboe stream, mematikan `AudioPassthroughService` foreground notification, dan memanggil `finishAndRemoveTask()` sehingga aplikasi tertutup bersih 100%.
            2. **🔽 Tombol Minimize**:
               - Terletak di sebelah kiri ikon Settings (`moveTaskToBack(true)`).
               - Memungkinkan pengguna bernyanyi karaoke sambil membuka YouTube / Spotify di latar belakang tanpa mematikan suara mic!
            3. **17 Efek Suara Real-time Lengkap**:
               - Normal, Jokowi Soundbox, Cowo, Cewe, Lucu, Imut, Toa (Megaphone), Robot, HT Radio, Penyiar DJ, Monster, Helium, Masjid, Kakek, Telepon, Clarity, Echo.
            1. **🎤 Normal**: Suara asli mikrofon tanpa manipulasi.
            2. **🇮🇩 Jokowi (Soundbox)**: Vokal khas sengau Pak Jokowi dengan resonansi GoPay Soundbox.
            3. **👨 Cowo**: Suara pria berat / deep bass baritone.
            4. **👩 Cewe**: Suara wanita nyaring natural.
            5. **🐹 Lucu**: Karakter kartun chipmunk ceria.
            6. **🌸 Imut**: Karakter anime / kawaii manis dengan ambient halus.
            7. **📢 Toa**: Suara corong megaphone / pengumuman bandpass.
            8. **🤖 Robot**: Ring modulation cybernetic 70 Hz.
            9. **📻 HT Radio**: Walkie-talkie polisi/satpam dengan bandpass ketat & radio static squelch.
            10. **🎧 Penyiar DJ**: Karakter vokal radio FM broadcast tebal & hangat (proximity bass + presence).
            11. **👻 Monster**: Suara raksasa berat & menyeramkan (pitch 0.64x + sub-growl).
            12. **🎈 Helium**: Suara balon helium pitch super tinggi melengking (pitch 1.85x).
            13. **🏛️ Masjid**: Gema reverberasi megah kubah masjid / aula katedral.
            14. **👴 Kakek**: Suara orang tua dengan tremor getaran pita suara lembut (5.5 Hz LFO).
            15. **📱 Telepon**: Karakter telepon kabel analog jadul (carbon mic bandpass).
            16. **🎙️ Clarity**: Mode vokal jernih bebas dengung (High-Pass Filter).
            17. **🎶 Echo**: Gema karaoke stereo.
            
            ### Fitur Unggulan Sistem:
            - **Soft Limiter (Zero-Latency Anti-Clipping)**: Suara di bawah 0.8f linear 100%, kompresi soft-knee tanh di atas ambang batas mencegah distorsi/feedback.
            - **3-Band Equalizer**: Low-Shelf 200 Hz, Peaking 1000 Hz, High-Shelf 4000 Hz.
            - **YouTube & Spotify Karaoke Mixing**: Musik tidak ter-pause saat mic aktif (Shared AudioFocus).
            - **Routing Lancar TWS & Bluetooth**: OpenSL ES + AudioFlinger tanpa hening.
            - **Tombol Matikan Cepat**: Di notifikasi status bar.
            - **Permanent Release Keystore**: APK ditandatangani skema v1 + v2 permanen.
            
            - **MicToSpeaker-release.apk**: Optimized release build (ProGuard / R8 enabled, signed with permanent key).
            - **MicToSpeaker-debug.apk**: Debug build with logcat output enabled.
          prerelease: false
          files: release-apks/*.apk
