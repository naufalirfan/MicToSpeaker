name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APKs for release
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/MicToSpeaker-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/MicToSpeaker-release.apk
          fi
          ls -la release-apks/

      - name: Verify APK Signatures
        run: |
          for apk in release-apks/*.apk; do
            echo "=== Verifying signature for $apk ==="
            $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$apk"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MicToSpeaker-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.4
          name: "Mic to Speaker - NFL v1.0.4 (TWS & Bluetooth Audio Fix)"
          body: |
            ## Mic to Speaker - NFL v1.0.4 (TWS & Bluetooth Audio Fix)
            Automated build from commit ${{ github.sha }}.
            
            ### Solusi & Perbaikan Audio TWS / Bluetooth (No Sound Fix):
            - **OpenSL ES & AudioFlinger Routing for Bluetooth A2DP**:
              - AAudio MMAP Low-Latency memaksa hardware ALSA internal sehingga suara tidak bisa keluar ke Bluetooth A2DP / TWS.
              - Pada mode Bluetooth, sistem kini mengaktifkan OpenSL ES dan delegasi routing otomatis AudioFlinger Android sehingga audio mengalir lancar ke earphone/headphone/speaker Bluetooth.
            - **Decoupled Microphone Capture Thread + Lock-Free Jitter Buffer**:
              - Pemisahan total thread perekaman mic dari audio playback callback.
              - Mengatasi perbedaan burst size antara microphone hardware (192 frame) dan Bluetooth A2DP (512 - 1024 frame).
              - Dilengkapi auto-priming watermark (~21ms) untuk mencegah starving/glitch saat baru mulai, dan auto-drift limiter (~42-85ms) agar latensi tetap ultra-rendah.
            - **Dedicated Phone Mic Input Routing**:
              - Memastikan input selalu merekam dari microphone bawaan smartphone saat terhubung ke perangkat output Bluetooth A2DP.
            
            ### Fitur Efek Suara (Real-time Voice Effects):
            - **👨 Cowo**: Suara pria berat / deep bass voice.
            - **👩 Cewe**: Suara wanita nyaring natural.
            - **🐹 Lucu**: Suara kartun / chipmunk yang menggemaskan.
            - **🌸 Imut**: Suara anime / kawaii manis dengan soft ambient tone.
            - **🇮🇩 Jokowi**: Karakter suara khas Pak Jokowi dengan resonansi mid-nasal (1150 Hz) dan artikulasi santai.
            - **🎙️ Clarity**: Mode vokal jernih bebas dengung (High-Pass Filter).
            - **🎶 Echo**: Gema karaoke stereo.
            - **🎤 Normal**: Suara asli mikrofon tanpa manipulasi nada.
            
            ### Sertifikat & Kompatibilitas:
            - Ditandatangani menggunakan permanent release key (`release.jks`) dengan skema v1 + v2 full signature.
            - Kompatibel dengan Android 8.0 hingga Android 15 (semua arsitektur: arm64-v8a, armeabi-v7a, x86, x86_64).
            
            - **MicToSpeaker-release.apk**: Optimized release build (ProGuard / R8 enabled, signed with permanent key).
            - **MicToSpeaker-debug.apk**: Debug build with logcat output enabled.
          prerelease: false
          files: release-apks/*.apk
