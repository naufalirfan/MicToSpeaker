name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APKs for release
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/MicToSpeaker-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/MicToSpeaker-release.apk
          fi
          ls -la release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MicToSpeaker-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: "Mic to Speaker - NFL v1.0.1"
          body: |
            ## Mic to Speaker - NFL v1.0.1
            Automated build from commit ${{ github.sha }}.
            
            ### Changelog:
            - **Perbaikan Audio TWS & Bluetooth**: Mengatasi masalah suara hilang/tidak bunyi saat terhubung ke headset Bluetooth / TWS.
              - Output stream dioptimasi ke Stereo untuk A2DP profile.
              - Routing mikrofon otomatis diprioritaskan ke built-in mic ponsel saat mode A2DP/Speaker agar audio tertangkap jernih.
              - Penambahan adaptive fallback untuk berbagai jenis perangkat & vendor Bluetooth HAL.
              - Penambahan request Audio Focus kontinu untuk mencegah ducking/muting oleh sistem.
            - **Nama Aplikasi Baru**: "Mic to Speaker - NFL".
            
            - **MicToSpeaker-release.apk**: Optimized release build (ProGuard / R8 enabled, signed with debug keystore for easy sideloading).
            - **MicToSpeaker-debug.apk**: Debug build with logcat output enabled.
          prerelease: false
          files: release-apks/*.apk
