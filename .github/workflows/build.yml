name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APKs for release
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/MicToSpeaker-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/MicToSpeaker-release.apk
          fi
          ls -la release-apks/

      - name: Verify APK Signatures
        run: |
          for apk in release-apks/*.apk; do
            echo "=== Verifying signature for $apk ==="
            $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$apk"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MicToSpeaker-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.6
          name: "Mic to Speaker - NFL v1.0.6 (Soft Limiter, 3-Band EQ & YouTube Karaoke Mixing)"
          body: |
            ## Mic to Speaker - NFL v1.0.6 (Soft Limiter, 3-Band EQ & YouTube Karaoke Mixing)
            Automated build from commit ${{ github.sha }}.
            
            ### Fitur Baru & Peningkatan DSP (Sesuai Panduan Audio Engine C++):
            - **Soft Limiter (Zero-Latency Anti-Clipping)**:
              - Sinyal di bawah 0.8f (-2 dBFS) tetap 100% linear tanpa perubahan warna suara.
              - Transisi soft-knee saturasi tanh dinamis di atas ambang batas, mencegah suara nguing (feedback), distorsi pecah, dan kerusakan speaker saat volume/gain tinggi.
            - **3-Band Equalizer (Thread-Safe DSP)**:
              - Low-Shelf 200 Hz, Peaking 1000 Hz, High-Shelf 4000 Hz di dalam callback C++ Oboe.
            - **Preserving YouTube Karaoke Audio Mixing**:
              - Pengaturan AudioFocus cerdas (`AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK` pada media route) sehingga musik dari YouTube atau Spotify tidak ter-pause saat mic dinyalakan. Suara mic dan musik ter-mix bersamaan ke speaker Bluetooth/AUX.
            - **Preset Baru (Megaphone & Robot)**:
              - **📢 Toa / Megaphone**: Bandpass 600–2800 Hz dengan distorsi corong khas pengumuman.
              - **🤖 Robot**: Ring modulation sinus 70 Hz (85% wet / 15% dry).
            - **Aksi Cepat di Notifikasi**:
              - Tombol "Matikan" langsung di notification bar untuk menghentikan audio tanpa membuka aplikasi.
            
            ### Fitur Utama Sebelumnya:
            - Routing lancar Bluetooth TWS / A2DP & SCO tanpa hening (OpenSL ES + AudioFlinger).
            - Efek Suara GoPay Soundbox Jokowi (multi-stage RBJ formant modeling & cabinet reflection).
            - Decoupled mic capture thread dengan auto-priming watermark (~21ms) dan auto-drift limiter.
            - Permanent Keystore release signing (v1 + v2 scheme).
            
            - **MicToSpeaker-release.apk**: Optimized release build (ProGuard / R8 enabled, signed with permanent key).
            - **MicToSpeaker-debug.apk**: Debug build with logcat output enabled.
          prerelease: false
          files: release-apks/*.apk
