name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APKs for release
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/MicToSpeaker-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/MicToSpeaker-release.apk
          fi
          ls -la release-apks/

      - name: Verify APK Signatures
        run: |
          for apk in release-apks/*.apk; do
            echo "=== Verifying signature for $apk ==="
            $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$apk"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MicToSpeaker-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.3
          name: "Mic to Speaker - NFL v1.0.3 (Fixed Signed APK)"
          body: |
            ## Mic to Speaker - NFL v1.0.3 (Fixed Signed APK)
            Automated build from commit ${{ github.sha }}.
            
            ### Perbaikan Error "Aplikasi Tidak Terinstal":
            - **Permanent Keystore & Full APK Signature Scheme**:
              - Menggunakan permanent release keystore (`keystore/release.jks`) untuk kedua build (Release & Debug).
              - Skema v1 (JAR Signature) & v2 (Full APK Signature) aktif permanen sehingga Android 10, 11, 12, 13, 14, dan 15 dapat menginstal dan memperbarui aplikasi tanpa masalah kompatibilitas sertifikat.
            - **Universal ABI Support**:
              - Mendukung native architecture `arm64-v8a`, `armeabi-v7a`, `x86_64`, dan `x86`.
            - **Automated Signature Verification**:
              - CI memverifikasi keabsahan signature menggunakan `apksigner` sebelum merilis file.
            
            ### Fitur Efek Suara (Voice Effects):
            - **👨 Cowo**: Suara pria berat / deep bass voice.
            - **👩 Cewe**: Suara wanita nyaring natural.
            - **🐹 Lucu**: Suara kartun / chipmunk yang lucu dan menggemaskan.
            - **🌸 Imut**: Suara anime / kawaii manis dengan subtle soft ambiance.
            - **🇮🇩 Jokowi**: Khas karakter vokal Pak Jokowi dengan resonansi mid-nasal (1150 Hz bandpass filter) dan nada santai.
            - **🎙️ Clarity**: Mode vokal jernih bebas dengung (High-Pass Filter).
            - **🎶 Echo**: Gema karaoke stereo.
            - **🎤 Normal**: Suara asli mikrofon tanpa efek.
            
            - **MicToSpeaker-release.apk**: Optimized release build (ProGuard / R8 enabled, signed with permanent release key).
            - **MicToSpeaker-debug.apk**: Debug build with logcat output enabled.
          prerelease: false
          files: release-apks/*.apk
