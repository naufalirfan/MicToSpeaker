name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APKs for release
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/MicToSpeaker-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/MicToSpeaker-release.apk
          fi
          ls -la release-apks/

      - name: Verify APK Signatures
        run: |
          for apk in release-apks/*.apk; do
            echo "=== Verifying signature for $apk ==="
            $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$apk"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MicToSpeaker-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.5
          name: "Mic to Speaker - NFL v1.0.5 (GoPay Soundbox Jokowi Effect)"
          body: |
            ## Mic to Speaker - NFL v1.0.5 (GoPay Soundbox Jokowi Effect)
            Automated build from commit ${{ github.sha }}.
            
            ### Peningkatan Efek Suara Jokowi (GoPay Soundbox Style):
            - **Multi-stage RBJ Biquad Formant Modeling**:
              - **Nasal Formant Boost (1220 Hz, +9.5 dB)**: Menghasilkan resonansi sengau khas aksen Solo Pak Jokowi.
              - **Chest Scoop Filter (500 Hz, -5.5 dB)**: Meredam resonansi dada tebal agar vokal menjadi khas dan tidak seperti suara pria biasa.
              - **Throat Articulation Presence (2550 Hz, +6.5 dB)**: Mempertahankan kejelasan huruf konsonan dan artikulasi bicara.
              - **Box Speaker HPF (240 Hz) & LPF (4600 Hz)**: Memotong sub-bass dan mendesain acoustic frequency response khas speaker portabel GoPay Soundbox.
            - **Speaker Overdrive & Saturation Harmonics**:
              - Memberikan saturasi harmonik hangat orde ke-2 & ke-3 khas pengeras suara box POS.
            - **Cabinet Acoustic Reflection (~22ms Delay)**:
              - Memberikan pantulan akustik soundbox portabel secara real-time.
            - **Optimized Pitch Ratio (0.89x)**:
              - Menurunkan nada bicara ke register bariton santai dan berwibawa khas Pak Jokowi.
            
            ### Fitur Utama Sebelumnya:
            - Routing lancar Bluetooth TWS / A2DP & SCO tanpa hening (OpenSL ES + AudioFlinger).
            - Decoupled mic capture thread dengan auto-priming watermark (~21ms) dan auto-drift limiter.
            - Permanent Keystore release signing (v1 + v2 scheme).
            
            - **MicToSpeaker-release.apk**: Optimized release build (ProGuard / R8 enabled, signed with permanent key).
            - **MicToSpeaker-debug.apk**: Debug build with logcat output enabled.
          prerelease: false
          files: release-apks/*.apk
